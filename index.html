<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사이트 자동 운영 도우미</title>
  <link rel="stylesheet" href="styles.css?v=19">
</head>
<body>
  <header class="topbar">
    <div class="brand">사이트 자동 운영 도우미 <span class="tag">MVP</span></div>
    <div id="tenantBox"></div>
    <div class="notice">시연용 가상 데이터 — CVE ID·점수·날짜·오류 지표는 실제 정보와 무관</div>
    <div class="actions">
      <div class="bell-wrap">
        <button id="bellBtn" class="ghost" data-action="toggle-notif">알림</button>
        <div id="notifPanel" hidden></div>
      </div>
      <button id="simBtn" data-action="simulate">위협 정보 갱신 시뮬레이션</button>
      <button data-action="ops-quick">오류 발생 시뮬레이션</button>
      <button class="ghost" data-action="reset">데모 초기화</button>
    </div>
  </header>
  <div class="layout">
    <!-- 기획안_v3 6-7 화면 구조(IA): 보안 운영·오류 운영 두 축 -->
    <nav class="sidebar">
      <a href="#todo" data-nav="todo">할 일</a>
      <div class="nav-label">기본</div>
      <a href="#chat" data-nav="chat">에이전트 대화</a>
      <a href="#report" data-nav="report">보고</a>
      <div class="nav-label">보안 운영</div>
      <a href="#dashboard" data-nav="dashboard">위협 현황</a>
      <a href="#analysis" data-nav="analysis">위협 분석</a>
      <div class="nav-label">오류 운영</div>
      <a href="#ops" data-nav="ops">오류 모니터링</a>
      <div class="nav-label">기록</div>
      <a href="#tasks" data-nav="tasks">조치 업무 기록</a>
      <a href="#history" data-nav="history">이력</a>
      <div class="nav-label">설정</div>
      <a href="#assets" data-nav="assets">자산·연결 소스</a>
      <a href="#starter" data-nav="starter">사이트 시작하기</a>
      <a href="#plans" data-nav="plans">요금제·지원사업</a>
      <div class="nav-label">파트너 콘솔</div>
      <a href="#tenants" data-nav="tenants">고객사 현황</a>
    </nav>
    <main id="view"></main>
  </div>
